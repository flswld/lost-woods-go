    repeated BreakoutAction action_list = 5;
    uint32 wave_index = 6;
    bool is_finish = 7;
    uint32 score = 8;
    uint32 combo = 9;
    uint32 max_combo = 10;
    uint32 life_count = 11;
    uint32 wave_suite_index = 12;
    repeated BreakoutSpawnPoint spawn_point_list = 13;
