message AbilityMixinRecoverInfo {
    uint32 local_id = 3;
    repeated uint32 data_list = 4;
    bool is_serverbuff_modifier = 5;
    repeated MassivePropSyncInfo massive_prop_list = 6;
    BreakoutSnapShot breakout_snap_shot = 7;
    oneof Source {
        uint32 instanced_ability_id = 1;
        uint32 instanced_modifier_id = 2;
    }
}

// 一个entity需要状态同步的完整信息
message AbilitySyncStateInfo {
    bool is_inited = 1;                                     // 是否已经初始化过
    repeated AbilityScalarValueEntry dynamic_value_map = 2; // ability global value
    repeated AbilityAppliedAbility applied_abilities = 3;   // 所有的ability
    repeated AbilityAppliedModifier applied_modifiers = 4;  // 所有的modifier
    repeated AbilityMixinRecoverInfo mixin_recover_infos = 5;
    repeated AbilityScalarValueEntry sgv_dynamic_value_map = 6;
}

message AbilityEmbryo {
    uint32 ability_id = 1;
    fixed32 ability_name_hash = 2;
    fixed32 ability_override_name_hash = 3;
