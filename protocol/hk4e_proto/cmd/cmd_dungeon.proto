}

message DungeonDieOptionRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 948;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    int32 retcode = 5;
    uint32 revive_count = 10; // 一共复活了多少次
    PlayerDieOption die_option = 6;
}

