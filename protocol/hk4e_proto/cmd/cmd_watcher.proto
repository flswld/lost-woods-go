// 观测者系统，用于触发教学或成就

syntax = "proto3";

package proto;

option go_package = "./;proto";

enum PushTipsState {
    PUSH_TIPS_STATE_NONE = 0;
    PUSH_TIPS_STATE_START = 1;  // 激活
    PUSH_TIPS_STATE_READ = 2;   // 读完教学
    PUSH_TIPS_STATE_FINISH = 3; // 完成领奖
}

// 通知全部观察者
message WatcherAllDataNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2272;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated uint32 watcher_list = 4; // 正在进行的且客户端需要监听的watcher
}

// 观察者变化通知
message WatcherChangeNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2298;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated uint32 removed_watcher_list = 2; // 通知客户端卸下的watcher
    repeated uint32 new_watcher_list = 15;    // 新增的客户端需要监听的watcher
}

// 客户端通知服务器某个观察者进度发生变化（C->S）
message WatcherEventNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2212;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 add_progress = 6; // 增加的进度
    uint32 watcher_id = 9;   // 观测者ID
}

// 客户端通知服务器某种类观察者进度发生变化（C->S）
message WatcherEventTypeNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2235;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    repeated uint32 param_list = 14;  // 触发参数
    uint32 add_progress = 15;         // 增加的进度
    uint32 watcher_trigger_type = 11; // 观测者ID
}

message WatcherEventStageNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2207;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 add_progress = 4;
    uint32 stage = 2;
    uint32 watcher_id = 12;
}

// 教学记录
message PushTipsData {
    uint32 push_tips_id = 13;
    uint32 state = 4; // proto::PushTipsState
}

// 通知所有教学信息
message PushTipsAllDataNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2222;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated PushTipsData push_tips_list = 4; // 教学列表
}

// 教学变化通知
message PushTipsChangeNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2265;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated PushTipsData push_tips_list = 9; // push_tips改变
}

// 读完教学
message PushTipsReadFinishReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2204;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 push_tips_id = 11;
}

message PushTipsReadFinishRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2293;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint32 push_tips_id = 3;
    int32 retcode = 9;
}

// 领取当前已读完的教学的奖励
message GetPushTipsRewardReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2227;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    repeated uint32 push_tips_id_list = 4; // 要领奖的教学ID，服务器不判断是否已读完
}

message GetPushTipsRewardRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2294;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    int32 retcode = 10;
    repeated uint32 push_tips_id_list = 9; // 领过的教学
}
