    uint32 old_level = 13;                      // 升级前等级
    map<uint32, float> old_fight_prop_map = 10; // 升级前的战斗属性
    int32 retcode = 1;
    map<uint32, float> cur_fight_prop_map = 4;  // 升级后的战斗属性
    uint64 avatar_guid = 15;                    // 唯一ID
}

