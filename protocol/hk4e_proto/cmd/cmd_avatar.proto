    repeated AvatarInfo avatar_list = 6;         // 所有角色的列表
    uint32 cur_avatar_team_id = 2;               // 当前出战的队伍ID
    repeated AvatarRenameInfo avatar_rename_list = 4;
    repeated uint32 owned_flycloak_list = 1;
    repeated uint32 owned_costume_list = 11;
    map<uint32, AvatarTeam> avatar_team_map = 7; // 所有的角色队伍
    uint64 choose_avatar_guid = 8;               // 一开始选择的角色
}

// 角色升级协议
