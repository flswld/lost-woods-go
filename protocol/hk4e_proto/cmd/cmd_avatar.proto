// 角色相关协议

syntax = "proto3";

package proto;

import "define.proto";

option go_package = "./;proto";

// 玩家的角色增加通知
message AvatarAddNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1769;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    AvatarInfo avatar = 13; // 新增角色
    bool is_in_team = 12;
}

// 玩家的角色删除通知(仅用于测试)
message AvatarDelNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1773;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated uint64 avatar_guid_list = 13; // 删除角色列表
}

// 角色队伍
message AvatarTeam {
    repeated uint64 avatar_guid_list = 7; // 角色列表
    string team_name = 14;
}

// 设置角色队伍
message SetUpAvatarTeamReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1690;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 team_id = 3;                        // 队伍ID
    repeated uint64 avatar_team_guid_list = 7; // 队伍成员
    uint64 cur_avatar_guid = 5;                // 当前上场角色, 设置当前队伍时需要使用
}

message SetUpAvatarTeamRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1646;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated uint64 avatar_team_guid_list = 1; // 队伍成员
    uint32 team_id = 6;                        // 队伍ID
    int32 retcode = 8;
    uint64 cur_avatar_guid = 13;               // 当前上场角色, 设置当前队伍时需要使用
}

