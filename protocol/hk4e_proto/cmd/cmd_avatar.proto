        IS_ALLOW_CLIENT = 1;
    }

    uint64 avatar_guid = 6; // 道具使用的目标角色
    uint32 count = 2;       // 使用个数(只针对可堆叠类道具)
    uint32 item_id = 5;     // 经验材料ID
}

// 角色升级响应
