// 杂项协议

syntax = "proto3";

package proto;

import "cmd/cmd_social.proto";
import "define.proto";

option go_package = "./;proto";

// 服务器消息ID(todo: 消息增多后，移动到单独的文件中)
enum SvrMsgId {
    MSG_UNKNOWN = 0;
    MSG_BLOCK_REFRESH_COUNTDOWN = 1;   // 怪物即将刷新
    MSG_AVATAR_REVIVE_BY_STATUE = 2;   // 女神像复活角色
    MSG_DAILY_TASK_REWARD_MAX_NUM = 3; // 固定事件奖励次数到达上限
    MSG_ROUTINE_TYPE_NOT_OPEN = 4;
    MSG_ROUTINE_TYPE_REWARD_MAX_NUM = 5;
    MSG_MECHANICUS_COIN_LIMIT = 6;
}

// 服务器日志类型
enum ServerLogType {
    SERVER_LOG_NONE = 0;
    SERVER_LOG_ABILITY = 1; // Ability日志
    SERVER_LOG_LEVEL = 2;   // 关卡日志
    SERVER_LOG_ENTITY = 3;  // Entity日志
    SERVER_LOG_LUA = 4;
}

// 服务器日志等级
enum ServerLogLevel {
    LOG_LEVEL_NONE = 0;
    LOG_LEVEL_DEBUG = 1;
    LOG_LEVEL_INFO = 2;
    LOG_LEVEL_WARNING = 3;
    LOG_LEVEL_ERROR = 4;
}

enum ClientReconnectReason {
    CLIENT_RECONNNECT_NONE = 0;
    CLIENT_RECONNNECT_QUIT_MP = 1; // 退出联机
}

// 心跳包，不需要任何字段
message KeepAliveNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 72;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }
}

// GmTalk调试命令
message GmTalkReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 98;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    string msg = 13; // 调试信息
}

message GmTalkRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 12;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    int32 retcode = 15;
    string retmsg = 3; // 返回消息
    string msg = 13;   // 成功时返回原消息
}

// 消息参数
message MsgParam {
    oneof param {
        uint32 int_param = 9; // 整形参数
        float flt_param = 7;  // 浮点型参数
        string str_param = 4; // 字符串参数
    }
}

// 在客户端显示消息(S->C)
message ShowMessageNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 35;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    SvrMsgId msg_id = 14;          // 消息ID
    repeated MsgParam params = 13; // 参数列表
}

// 连接探测
message PingReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 7;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 client_time = 12; // 客户端的时间戳
    float ue_time = 14;
    double total_tick_time = 6;
    bytes sc_data = 10;
    uint32 seq = 3;          // 序列号
}

message PingRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 21;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint32 client_time = 15; // 转发req里面的client_time
    int32 retcode = 6;
    uint32 seq = 13;         // 序列号
}

// 获取在线玩家列表，DEBUG功能
message GetOnlinePlayerListReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 90;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }
}

message GetOnlinePlayerListRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 73;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    int32 retcode = 7;
    uint32 param = 11;
    repeated OnlinePlayerInfo player_info_list = 5;
}

// 服务器时间，定时推送给客户端对时
message ServerTimeNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 99;
        ENET_CHANNEL_ID = 1;
        ENET_IS_RELIABLE = 1;
    }

    uint64 server_time = 5; // 服务器时间(1970.1.1开始的毫秒数)
}

// 服务器日志通知
message ServerLogNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 31;
        ENET_CHANNEL_ID = 1;
        ENET_IS_RELIABLE = 1;
    }

    string server_log = 7;         // 服务器日志
    ServerLogType log_type = 9;    // 日志类型
    ServerLogLevel log_level = 15; // 日志等级
}

// 服务器通知客户端重连一次
message ClientReconnectNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 75;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    ClientReconnectReason reason = 6;
}

// 推送PlayerDataBin，仅供robot使用
message RobotPushPlayerDataNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 97;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    bytes bin = 6;
}

message ClientReportNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 81;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    string report_type = 1;
    string report_value = 4;
}

message UnionCmd {
    bytes body = 14;
    uint32 message_id = 8;
}

message UnionCmdNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 5;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    repeated UnionCmd cmd_list = 1;
}

message GetOnlinePlayerInfoReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 82;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    bool is_online_id = 15;
    oneof player_id {
        uint32 target_uid = 9;
        string online_id = 7;
        string psn_id = 2;
    }
}

message GetOnlinePlayerInfoRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 47;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    int32 retcode = 11;
    uint32 target_uid = 7;
    uint32 param = 4;
    OnlinePlayerInfo target_player_info = 14;
}

message SegmentInfo {
    uint32 offset = 3;
    uint32 module = 7;
    uint32 size = 8;
}

message SegmentCRCInfo {
    uint32 module = 13;
    int32 retcode = 5;
    uint32 size = 10;
    string crc = 3;
    uint32 offset = 11;
}

message CheckSegmentCRCNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 39;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated SegmentInfo info_list = 6;
}

message CheckSegmentCRCReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 53;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    repeated SegmentCRCInfo info_list = 1;
}

message PlayerRTTInfo {
    uint32 rtt = 2;
    uint32 uid = 1;
}

message WorldPlayerRTTNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 22;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated PlayerRTTInfo player_rtt_list = 1;
}

message EchoNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 65;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint32 seq_id = 4;
    string content = 9;
}

message UpdateRedPointNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 93;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated RedPointData red_point_list = 12;
}

message ClientBulletCreateNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 4;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 param = 6;
}

message ChangeServerGlobalValueNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 27;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 entity_id = 4;
}

message GmTalkNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 94;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    string msg = 5;
}

message LastPacketPrintNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 88;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }
}
