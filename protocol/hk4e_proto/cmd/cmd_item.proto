// 道具合成请求
message CombineReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 643;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 combine_count = 12; // 合成几份
    uint32 combine_id = 9;     // 合成ID
    uint64 avatar_guid = 14;   // 角色的唯一ID
}

message CombineRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 674;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated ItemParam cost_item_list = 3;          // 一份消耗的材料
    int32 retcode = 7;
    repeated ItemParam total_extra_item_list = 6;   // （得意技影响）总共的额外产物，包括概率多倍获得的产物和概率获得的额外产物
    uint32 combine_id = 11;                         // 合成ID
    repeated ItemParam total_random_item_list = 9;  // 总共的随机产物
    repeated ItemParam result_item_list = 2;        // 一份的固定产物
    uint32 combine_count = 13;                      // 合成几份
    repeated ItemParam total_return_item_list = 12; // （得意技影响）总共返还的原材料
    uint64 avatar_guid = 10;                        // 角色的唯一ID
}

// 锻造队列数据（一个锻造队列一次只能处理一个锻造ID）
message ForgeQueueData {
    uint32 finish_count = 13;           // 几份可领取
    uint32 total_finish_timestamp = 14; // 全部完成的时间戳
    uint32 avatar_id = 7;               // 角色ID
    uint32 queue_id = 1;                // 锻造队列ID
    uint32 unfinish_count = 10;         // 还剩几份未完成
    uint32 next_finish_timestamp = 11;  // 下一份的完成时间戳
    uint32 forge_id = 15;               // 锻造ID
}

// 锻造队列数据变化（开始锻造后/锻造部分或全部完成时/领取锻造产出后）发送
message ForgeQueueDataNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 676;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    map<uint32, ForgeQueueData> forge_queue_map = 7; // 新增或发生变化的锻造队列
    repeated uint32 removed_forge_queue_list = 6;    // 删除的锻造队列
}

