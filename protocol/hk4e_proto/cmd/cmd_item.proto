// 道具协议

syntax = "proto3";

package proto;

import "define.proto";

option go_package = "./;proto";

enum ForgeQueueManipulateType {
    FORGE_QUEUE_MANIPULATE_TYPE_RECEIVE_OUTPUT = 0; // 领取锻造产出
    FORGE_QUEUE_MANIPULATE_TYPE_STOP_FORGE = 1;     // 终止锻造
}

enum MaterialDeleteReturnType {
    MATERIAL_DELETE_RETURN_BAG = 0;
    MATERIAL_DELETE_RETURN_SEED = 1;
}

// 存储(背包或仓库)通知(S->C)
message PlayerStoreNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 672;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated Item item_list = 15; // 所有道具
    uint32 weight_limit = 8;      // 重量上限(0为无限制)
    StoreType store_type = 2;     // 存储类型
}

// 背包重量上限通知(S->C)
message StoreWeightLimitNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 698;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint32 weapon_count_limit = 2;
    StoreType store_type = 7; // 存储类型
    uint32 material_count_limit = 4;
    uint32 reliquary_count_limit = 6;
    uint32 furniture_count_limit = 9;
    uint32 weight_limit = 15; // 重量上限
}

// 存储(背包或仓库)中道具增加通知(S->C)
message StoreItemChangeNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 612;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    StoreType store_type = 12;    // 存储类型
    repeated Item item_list = 10; // 增加的道具
}

// 存储(背包或仓库)中道具删除通知(S->C)
message StoreItemDelNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 635;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated uint64 guid_list = 12; // 道具唯一ID
    StoreType store_type = 15;      // 存储类型
}

message ItemHint {
    uint32 item_id = 8;
    bool is_new = 2;
    uint32 count = 15;
    uint64 guid = 4;
}

// 获得道具提示（只做展示）
message ItemAddHintNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 607;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    bool is_position_valid = 14; // position是否有效
    uint32 quest_id = 3;         // 任务ID
    uint32 reason = 6;           // 获得道具原因 ItemAddReasonType
    bool is_general_reward_hiden = 15;
    repeated ItemHint item_list = 10;
    bool is_transfered_from_avatar_card = 12;
    Vector position = 9;         // 获取物品的场景位置
    repeated ItemHint overflow_transformed_item_list = 8;
}

// 使用背包中的道具
message UseItemReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 690;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 count = 13;       // 使用个数(只针对可堆叠类道具)
    uint64 target_guid = 14; // 道具使用的目标角色
    uint64 guid = 10;        // 唯一ID
    bool is_enter_mp_dungeon_team = 15;
    uint32 option_idx = 7;   // 从1开始的选项序号
}

message UseItemRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 673;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint64 guid = 5;        // 唯一ID
    uint64 target_guid = 1; // 道具使用的目标角色
    uint32 item_id = 4;     // 道具ID
    uint32 option_idx = 8;  // 从1开始的选项序号
    int32 retcode = 14;
}

