// battlepass系统

syntax = "proto3";

package proto;

import "define.proto";

option go_package = "./;proto";

enum BattlePassUnlockStatus {
    BATTLE_PASS_UNLOCK_INVALID = 0; // 非法状态
    BATTLE_PASS_UNLOCK_FREE = 1;    // 普通免费版BattlePass
    BATTLE_PASS_UNLOCK_PAID = 2;    // 付费版BattlePass, 能领的奖励多一点
}

message BattlePassCycle {
    uint32 cycle_idx = 3;   // 从1开始的周期序号
    uint32 end_time = 10;   // 结束时间
    uint32 begin_time = 13; // 开始时间
}

message BattlePassMission {
    enum MissionStatus {
        MISSION_INVALID = 0;     // 非法
        MISSION_UNFINISHED = 1;  // 未结束
        MISSION_FINISHED = 2;    // 已结束
        MISSION_POINT_TAKEN = 3; // 点数已领取
    }

    uint32 cur_progress = 13;            // 当前进度
    MissionStatus mission_status = 15;   // 任务状态
    uint32 mission_id = 11;              // mission_id, 即对应的watcher_id
    uint32 reward_battle_pass_point = 3; // 奖励BP点数
    uint32 mission_type = 12;            // 每日/每周期/活动期间
    uint32 total_progress = 6;           // 总进度
}

message BattlePassRewardTag {
    uint32 level = 4;                         // 对应等级
    BattlePassUnlockStatus unlock_status = 2; // 付费状态
    uint32 reward_id = 7;                     // 对应的reward_id
}

message BattlePassProduct {
    string normal_product_id = 13;
    string extra_product_id = 10;
    string upgrade_product_id = 6;
}

message BattlePassSchedule {
    uint32 level = 14;
    uint32 begin_time = 2;
    uint32 end_time = 15;
    uint32 point = 1;
    BattlePassCycle cur_cycle = 4;
    BattlePassUnlockStatus unlock_status = 7;
    repeated BattlePassRewardTag reward_taken_list = 11;
    uint32 cur_cycle_points = 10;
    uint32 paid_platform_flags = 12;
    BattlePassProduct product_info = 13;
    bool is_extra_paid_reward_taken = 6;
    bool is_viewed = 3;
    uint32 schedule_id = 9;
}

// 全量通知所有信息
message BattlePassAllDataNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2626;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    bool have_cur_schedule = 2; // 当前是否有排期
    repeated BattlePassMission mission_list = 4;
    BattlePassSchedule cur_schedule = 1;
}

// 添加/更新BattlePass任务
message BattlePassMissionUpdateNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2618;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated BattlePassMission mission_list = 1;
}

message BattlePassMissionDelNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2625;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated uint32 del_mission_id_list = 10;
}

// 当前排期相关信息(积分/等级/奖励)变动信息
message BattlePassCurScheduleUpdateNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2607;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    bool have_cur_schedule = 11;         // 当前是否有排期
    BattlePassSchedule cur_schedule = 1; // 当前排期的信息
}

message BattlePassRewardTakeOption {
    BattlePassRewardTag tag = 10; // 领奖Tag
    uint32 option_idx = 14;       // 选项IDX 从1开始
}

message TakeBattlePassRewardReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2602;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    repeated BattlePassRewardTakeOption take_option_list = 12; // 选择道具领奖的选项，用于reward中包含自选道具的情况
}

message TakeBattlePassRewardRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2631;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated ItemParam item_list = 7;
    int32 retcode = 13;
    repeated BattlePassRewardTakeOption take_option_list = 9; // 选择道具领奖的选项，用于reward中包含自选道具的情况
}

message TakeBattlePassMissionPointReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2629;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    repeated uint32 mission_id_list = 5;
}

message TakeBattlePassMissionPointRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2622;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    int32 retcode = 4;
    repeated uint32 mission_id_list = 11;
}

message GetBattlePassProductReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2644;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 battle_pass_product_play_type = 10;
}

message GetBattlePassProductRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2649;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    int32 retcode = 14;
    string price_tier = 6;
    uint32 battle_pass_product_play_type = 2;
    string product_id = 1;
    uint32 cur_schedule_id = 11;
}

message SetBattlePassViewedReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2641;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 schedule_id = 6;
}

message SetBattlePassViewedRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2642;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint32 schedule_id = 2;
    int32 retcode = 3;
}

message BattlePassBuySuccNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2614;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint32 schedule_id = 4;
    uint32 product_play_type = 11;
    uint32 add_point = 12;
    repeated ItemParam item_list = 9;
}

message BuyBattlePassLevelReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2647;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 buy_level = 8;
}

message BuyBattlePassLevelRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 2637;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    int32 retcode = 5;
    uint32 buy_level = 13;
}
