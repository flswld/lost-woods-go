// 属性协议

syntax = "proto3";

package proto;

import "define.proto";

option go_package = "./;proto";

// 属性改变原因
enum PropChangeReason {
    PROP_CHANGE_NONE = 0;
    PROP_CHANGE_STATUE_RECOVER = 1;  // 女神像回复
    PROP_CHANGE_ENERGY_BALL = 2;     // 吃能量球
    PROP_CHANGE_ABILITY = 3;         // 技能改变
    PROP_CHANGE_LEVELUP = 4;         // 升级
    PROP_CHANGE_ITEM = 5;            // 使用道具
    PROP_CHANGE_AVATAR_CARD = 6;     // 角色卡转换
    PROP_CHANGE_CITY_LEVELUP = 7;    // 城市升级
    PROP_CHANGE_AVATAR_UPGRADE = 8;  // 角色升级
    PROP_CHANGE_AVATAR_PROMOTE = 9;  // 角色突破
    PROP_CHANGE_PLAYER_ADD_EXP = 10; // 增加玩家经验
    PROP_CHANGE_FINISH_QUEST = 11;   // 完成任务触发
    PROP_CHANGE_GM = 12;
    PROP_CHANGE_MANUAL_ADJUST_WORLD_LEVEL = 13;
}

enum ChangeEnergyReason {
    CHANGE_ENERGY_NONE = 0;
    CHANGE_ENERGY_SKILL_START = 1;
}

// 展示用的“新”标记
enum MarkNewType {
    MARK_NEW_TYPE_NONE = 0;
    MARK_NEW_TYPE_COMBINE = 1; // 合成系统
    MARK_NEW_TYPE_FORGE = 2;   // 锻造系统
}

// 实体属性通知(S->C改变后通知)
message EntityPropNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1272;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    map<uint32, PropValue> prop_map = 1; // 属性列表
    uint32 entity_id = 14;               // 实体ID
}

// 实体生命状态改变通知(S->C)
message LifeStateChangeNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1298;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint32 entity_id = 4;
    repeated ServerBuff server_buff_list = 6;
    string attack_tag = 7;         // AttackResult中的标记
    uint32 move_reliable_seq = 15; // 移动的可靠包的序列号
    PlayerDieType die_type = 14;   // 死亡原因(仅在死亡状态时有效)
    uint32 life_state = 5;         // 生命状态(取值范围：LifeState)
    uint32 source_entity_id = 1;   // 源实体ID
}

// 战斗属性全量同步协议
message EntityFightPropNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1212;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint32 entity_id = 4; // 实体ID
    map<uint32, float> fight_prop_map = 8;
}

// 战斗属性差量同步
message EntityFightPropUpdateNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1235;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    map<uint32, float> fight_prop_map = 15;
    uint32 entity_id = 13; // 实体ID
}

// 角色战斗属性全量同步
message AvatarFightPropNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1207;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    map<uint32, float> fight_prop_map = 8;
    uint64 avatar_guid = 4; // 实体ID
}

// 角色战斗属性差量同步
message AvatarFightPropUpdateNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1221;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    map<uint32, float> fight_prop_map = 15;
    uint64 avatar_guid = 13; // 实体ID
}

// 战斗属性改变原因通知
message EntityFightPropChangeReasonNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1203;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated uint32 param_list = 10; // 改变参数
    float prop_delta = 1;            // 属性改变
    ChangHpReason change_hp_reason = 14;
    PropChangeReason reason = 6;     // 改变原因
    uint32 entity_id = 5;            // 实体ID
    ChangeEnergyReason change_energy_reson = 15;
    uint32 prop_type = 13;           // 属性类型(取值范围：FightPropType)
}

// 实体生命状态改变通知(S->C)
message AvatarLifeStateChangeNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1290;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint32 life_state = 13;       // 生命状态(取值范围：LifeState)
    string attack_tag = 10;       // AttackResult中的标记
    PlayerDieType die_type = 2;   // 死亡原因(仅在死亡状态时有效)
    repeated ServerBuff server_buff_list = 12;
    uint32 move_reliable_seq = 5; // 移动的可靠包的序列号
    uint32 source_entity_id = 3;  // 源实体ID
    uint64 avatar_guid = 11;
}

// 角色属性变化(S->C)
message AvatarPropChangeReasonNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1273;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    float old_value = 11;
    PropChangeReason reason = 5;
    uint32 prop_type = 1;
    uint64 avatar_guid = 8;
    float cur_value = 15;
}

// 玩家属性变化(S->C)
message PlayerPropChangeReasonNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1299;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    uint32 prop_type = 6;
    float old_value = 12;
    PropChangeReason reason = 1;
    float cur_value = 11;
}

// 通知角色属性全量更新，不表现(S->C改变后通知)
message AvatarPropNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1231;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    map<uint32, int64> prop_map = 14; // 属性列表
    uint64 avatar_guid = 15;          // 角色guid
}

// 通知客户端需要标新的地方
message MarkNewNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1275;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    repeated uint32 id_list = 7; // ID列表
    uint32 mark_new_type = 11;   // 标新系统
}
