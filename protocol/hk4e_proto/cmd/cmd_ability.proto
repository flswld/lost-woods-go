// 客户端技能系统开始初始化通知(C->S)
message ClientAbilityInitBeginNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1112;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    uint32 entity_id = 1; // 实体ID
}

// 客户端技能系统初始化完成通知(C->S)
message ClientAbilityInitFinishNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1135;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    repeated AbilityInvokeEntry invokes = 14; // 初始化前需要完成的invoke
    uint32 entity_id = 11;                    // 实体ID
}

// 服务器的技能调用失败通知(S->C)
message AbilityInvocationFailNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1107;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    string reason = 7;             // 失败原因
    uint32 entity_id = 13;         // 实体ID
    AbilityInvokeEntry invoke = 3; // 调用
}

message EntityAbilityInvokeEntry {
    uint32 entity_id = 8;                    // 实体ID
    repeated AbilityInvokeEntry invokes = 1; // 初始化前需要完成的invoke
}

// 客户端技能系统初始化完成通知(合包）(C->S)
