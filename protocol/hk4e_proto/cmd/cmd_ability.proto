// 技能协议

syntax = "proto3";

package proto;

import "cmd/cmd_fight.proto";
import "define.proto";

option go_package = "./;proto";

// Ability Head, 记录当前的ability类别，argumenttype是none时候，head中的localid一定不是INVOCATION_META_LOCALID(255)，表示要做action或者是mixin(每个mixin自己startrecordmixin相关的东西放过去)
// 有的argumenttype情况下还需要格外的参数定义，就定义在abilityinvoke的abilitydata中
enum AbilityInvokeArgument {
    ABILITY_NONE = 0;
    ABILITY_META_MODIFIER_CHANGE = 1;                 // 操作modifier
    ABILITY_META_COMMAND_MODIFIER_CHANGE_REQUEST = 2; // remote请求操作其他单位上的modifier
    ABILITY_META_SPECIAL_FLOAT_ARGUMENT = 3;          // 设置ability上的special float
    ABILITY_META_OVERRIDE_PARAM = 4;                  // 设置ability的overridemap的键值对
    ABILITY_META_CLEAR_OVERRIDE_PARAM = 5;            // 清理ability的overridemap的指定键
    ABILITY_META_REINIT_OVERRIDEMAP = 6;              // 重置ability的overridemap
    ABILITY_META_GLOBAL_FLOAT_VALUE = 7;              // 设置ability的globalvalue
    ABILITY_META_CLEAR_GLOBAL_FLOAT_VALUE = 8;        // 清除ability的globalvalue
    ABILITY_META_ABILITY_ELEMENT_STRENGTH = 9;        // 设置ability的元素强度
    ABILITY_META_ADD_OR_GET_ABILITY_AND_TRIGGER = 10; // remote请求authority添加或者触发技能
    ABILITY_META_SET_KILLED_SETATE = 11;              // 设置技能进入失效的状态
    ABILITY_META_SET_ABILITY_TRIGGER = 12;            // 设置ability的trigger
    ABILITY_META_ADD_NEW_ABILITY = 13;                // 添加ability
    ABILITY_META_REMOVE_ABILITY = 14;                 // 移除ability
    ABILITY_META_SET_MODIFIER_APPLY_ENTITY = 15;      // 设置modifier的applymodifierentityid
    ABILITY_META_MODIFIER_DURABILITY_CHANGE = 16;     // modifier的ElementDurablity变化
    ABILITY_META_ELEMENT_REACTION_VISUAL = 17;
    ABILITY_META_SET_POSE_PARAMETER = 18;
    ABILITY_META_UPDATE_BASE_REACTION_DAMAGE = 19;
    ABILITY_META_TRIGGER_ELEMENT_REACTION = 20;
    ABILITY_META_LOSE_HP = 21;
    ABILITY_META_DURABILITY_IS_ZERO = 22;
    // 需要override实现remote action操作定义
    ABILITY_ACTION_TRIGGER_ABILITY = 50;              // 技能action的trigger ability
    ABILITY_ACTION_SET_CRASH_DAMAGE = 51;             // 技能action的set crash damage
    ABILITY_ACTION_EFFECT = 52;                       // 技能action的fire或者attach effect
    ABILITY_ACTION_SUMMON = 53;                       // 技能action的召唤
    ABILITY_ACTION_BLINK = 54;                        // 技能action的blink
    ABILITY_ACTION_CREATE_GADGET = 55;                // 技能action的CreateGadget
    ABILITY_ACTION_APPLY_LEVEL_MODIFIER = 56;         // 技能action的ApplyLevelModifier
    ABILITY_ACTION_GENERATE_ELEM_BALL = 57;           // 技能action的GenerateElemBall
    ABILITY_ACTION_SET_RANDOM_OVERRIDE_MAP_VALUE = 58;
    ABILITY_ACTION_SERVER_MONSTER_LOG = 59;
    ABILITY_ACTION_CREATE_TILE = 60;
    ABILITY_ACTION_DESTROY_TILE = 61;
    ABILITY_ACTION_FIRE_AFTER_IMAGE = 62;
    ABILITY_ACTION_DEDUCT_STAMINA = 63;
    ABILITY_ACTION_HIT_EFFECT = 64;
    ABILITY_ACTION_SET_BULLET_TRACK_TARGET = 65;
    // 需要override实现remote mixin的操作定义
    ABILITY_MIXIN_AVATAR_STEER_BY_CAMERA = 100;       // 技能水激流mixin
    ABILITY_MIXIN_MONSTER_DEFEND = 101;               // 对应MonsterDefendMixin
    ABILITY_MIXIN_WIND_ZONE = 102;                    // 对应WindZoneMixin
    ABILITY_MIXIN_COST_STAMINA = 103;                 // 对应CostStaminaMixin
    ABILITY_MIXIN_ELITE_SHIELD = 104;                 // 对应EliteShieldMixin
    ABILITY_MIXIN_ELEMENT_SHIELD = 105;               // 对应ElementShieldMixin
    ABILITY_MIXIN_GLOBAL_SHIELD = 106;                // 对应GlobalShieldMixin
    ABILITY_MIXIN_SHIELD_BAR = 107;                   // 对应ShieldBarMixin
    ABILITY_MIXIN_WIND_SEED_SPAWNER = 108;            // 对应WindSeedSpawnerMixin
    ABILITY_MIXIN_DO_ACTION_BY_ELEMENT_REACTION = 109;
    ABILITY_MIXIN_FIELD_ENTITY_COUNT_CHANGE = 110;
    ABILITY_MIXIN_SCENE_PROP_SYNC = 111;
    ABILITY_MIXIN_WIDGET_MP_SUPPORT = 112;
    ABILITY_MIXIN_DO_ACTION_BY_SELF_MODIFIER_ELEMENT_DURABILITY_RATIO = 113;
    ABILITY_MIXIN_FIREWORKS_LAUNCHER = 114;
    ABILITY_MIXIN_ATTACK_RESULT_CREATE_COUNT = 115;
    ABILITY_MIXIN_UGC_TIME_CONTROL = 116;
    ABILITY_MIXIN_AVATAR_COMBAT = 117;
    ABILITY_MIXIN_DEATH_ZONE_REGIONAL_PLAY_MIXIN = 118;
    ABILITY_MIXIN_UI_INTERACT = 119;
    ABILITY_MIXIN_SHOOT_FROM_CAMERA = 120;
    ABILITY_MIXIN_ERASE_BRICK_ACTIVITY = 121;
    ABILITY_MIXIN_BREAKOUT = 122;
}

// AbilityMetaModifierChange中的modifier操作定义
enum ModifierAction {
    ADDED = 0;
    REMOVED = 1;
}

// Ability Head
message AbilityInvokeEntryHead {
    int32 modifier_config_local_id = 7; // ability中modifiers的index 从0开始
    bool is_serverbuff_modifier = 2;
    uint32 instanced_ability_id = 1;    // instanced ability id
    uint32 instanced_modifier_id = 12;  // instanced modifier id
    int32 local_id = 10;                // action 或者 mixin的config local id，从0开始, 两种情况，如果localid是INVOCATION_META_LOCALID（255），表示要做AbilityInvokeArgument中已有的事情，如果是非255，表示要做对应localid的action或者是mixin
    uint32 server_buff_uid = 14;
    uint32 target_id = 3;               // 当targetid是0，则表示当前消息的entity，否则代表instancedability要从该target上得到
}

// Ability Entry
message AbilityInvokeEntry {
    bytes ability_data = 15;                 // 因为要通用消息，所以把argumenttype非none时候的ability消息都放在这里转成protobuf的二进制
    AbilityInvokeEntryHead head = 2;         // head记录通用的ability信息
    uint32 event_id = 12;
    uint32 entity_id = 9;                    // 发起Invoke的Entity Runtime Id
    double total_tick_time = 14;
    uint32 forward_peer = 4;                 // 当forward_type是FORWARD_TO_PEER，填充的是peer id
    AbilityInvokeArgument argument_type = 1; // 记录当前的ability类别，argumenttype是none时候，head中的localid一定不是INVOCATION_META_LOCALID（255），表示要做action或者是mixin(每个mixin自己startrecordmixin相关的东西放过去)
    bool is_ignore_auth = 8;
    ForwardType forward_type = 3;            // 如果是authority同步给其他客户端的话，填充ForwardToAllExceptCur，否则从remote同步到authority，填充的是ForwardToPeer
}

// Ability的一条消息定义，为了省gcalloc，所以invoke1st....就没用直接用repeated
message AbilityInvocationFixedNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1172;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    AbilityInvokeEntry invoke6th = 14;
    AbilityInvokeEntry invoke5th = 8;
    AbilityInvokeEntry invoke4th = 1;
    AbilityInvokeEntry invoke2nd = 5;
    AbilityInvokeEntry invoke1st = 10;
    AbilityInvokeEntry invoke3rd = 12;
}

// Ability的一条消息定义, entry超过6的时候使用repeated
message AbilityInvocationsNotify {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 1198;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    repeated AbilityInvokeEntry invokes = 2;
}

// Ability重置overridemap
message AbilityMetaReInitOverrideMap {
    repeated AbilityScalarValueEntry override_map = 7; // 技能override map
}

// 对应AbilityInvokeArgument的ABILITY_META_ADD_ABILITY
message AbilityMetaAddAbility {
    AbilityAppliedAbility ability = 12;
}

// Modifier的属性
message ModifierProperty {
    AbilityString key = 15; // 属性名，应该用int编码
    float value = 5;        // 属性值
}

// 对应AbilityInvokeArgument的ABILITY_META_MODIFIER_CHANGE
message AbilityMetaModifierChange {
    AbilityAttachedModifier attached_instanced_modifier = 7; // 标识被attached的modifier
    uint32 server_buff_uid = 4;                              // 非0时表示modifier由某个sbuff加上，断线重连时会放在ServerBuff里还给客户端
    bool is_attached_parent_ability = 10;                    // 是否attach到parentAbility上
    ModifierAction action = 13;
    int32 modifier_local_id = 2;                             // modifier的config local id，请参考abilityentryhead中的定义
    AbilityString parent_ability_name = 1;                   // parent技能名字，防止parent ability的caster不存在或者没有准备好使用的，应该用int编码
    bool is_mute_remote = 6;                                 // 是否不发给remote
    uint32 apply_entity_id = 5;                              // modifier来源的entityid, 如果和当前单位id相同置0，省流量
    repeated ModifierProperty properties = 3;                // 当上modifier时候 parentability可能是null，所以将properties带上
    AbilityString parent_ability_override = 11;              // parent技能override，防止parent ability的caster不存在或者没有准备好使用的，应该用int编码
    bool is_durability_zero = 9;
}

message AbilityMetaDurabilityIsZero {
    bool is_zero = 5;
}

// 对应AbilityInvokeArgument的ABILITY_META_SPECIAL_FLOAT_ARGUMENT 设置actorability上的special float
message AbilityMetaSpecialFloatArgument {
    float argument_value = 14; // 值
    bool is_on = 10;           // 是否是设置还是重置
}

// 对应AbilityInvokeArgument的ABILITY_META_ADD_OR_GET_ABILITY_AND_TRIGGER
message AbilityMetaAddOrGetAbilityAndTrigger {
    AbilityString ability_name = 13;    // 技能名字 应该用int编码
    float trigger_argument = 3;         // 附带的参数
    AbilityString ability_override = 8; // 技能override 应该用int编码
}

// 对应AbilityInvokeArgument的ABILITY_META_SET_KILLED_SETATE
message AbilityMetaSetKilledState {
    bool killed = 2; // 是否被killed掉
}

// 对应AbilityInvokeArgument的ABILITY_META_SET_ABILITY_TRIGGER
message AbilityMetaSetAbilityTrigger {
    uint32 trigger_ability_entity_id = 11; // trigger的entity id
}

// 对应AbilityInvokeArgument的ABILITY_META_SET_MODIFIER_APPLY_ENTITY
message AbilityMetaSetModifierApplyEntityId {
    uint32 apply_entity_id = 10; // modifer的apply_entity id
}

// 对应AbilityInvokeArgument的ABILITY_META_MODIFIER_DURABILITY_CHANGE
message AbilityMetaModifierDurabilityChange {
    float reduce_durability = 6;
    float remain_durability = 15;
}

message AbilityMetaElementReactionVisual {
    int32 hit_index = 2;
