        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
        IS_ALLOW_CLIENT = 1;
    }

    repeated EntityAbilityInvokeEntry entity_invoke_list = 1;
}

// 风种子相关的客户端通知
message WindSeedClientNotify {
