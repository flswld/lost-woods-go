// 充值协议

syntax = "proto3";

package proto;

option go_package = "./;proto";

message Order {
    uint32 id = 1;                // MySQL 主键
    uint32 uid = 2;               // 玩家uid
    string product_id = 3;        // 商品id, 客户端下单时指定的
    string product_name = 4;
    uint32 product_num = 5;       // 下单时客户端提供
    uint32 coin_num = 6;          // 自定义充值水晶, 海外点卡充值的情况下使用
    string total_fee = 7;
    string currency = 8;          // 货币类型, 需要校验
    string price_tier = 9;        // 价格档位, 需要校验
    string trade_no = 10;
    uint32 trade_time = 11;
    // string trade_no = 10;       // 流水号 全局唯一
    uint32 channel_id = 12;
    string channel_order_no = 13; // 和channel_id组合后全局唯一
    string pay_plat = 14;         // 支付渠道
    string extend = 15;           // 扩展参数, 客户端提供
    uint32 create_time = 16;
    string bonus = 17;
    uint32 bonus_num = 18;
    uint32 vip_point_num = 19;
    string pay_type = 20;
    string pay_vendor = 21;
    string client_type = 22;
    string device = 23;
    string client_ip = 24;
}

// oaserver接到一笔订单通知game处理
message RechargeOrderNotify {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10726;
    }

    Order order = 1;
}

// game通知oa标记订单完成
message MarkOrderFinishedReq {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10718;
    }

    uint32 order_id = 1;    // 订单编号
    uint32 finish_time = 2; // 完成时间
    bool is_retry = 3;
}

message MarkOrderFinishedRsp {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10725;
    }

    int32 retcode = 1;
    uint32 order_id = 2; // 订单编号
}

// 玩家上线后拉取近30天未完成的订单
message GetUnfinishedOrderReq {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10707;
    }
}

message GetUnfinishedOrderRsp {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10702;
    }

    int32 retcode = 1;
    repeated Order order_list = 2;
}

message GetSpecificUnfinishedReq {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10731;
    }

    uint32 order_id = 1;
}

message GetSpecificUnfinishedRsp {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10729;
    }

    int32 retcode = 1;
    Order order = 2;
}
