// 为服务器玩家数据协议

syntax = "proto3";

package proto;

import "define.proto";
import "server_only/bin.server.proto";

option go_package = "./;proto";

// 保存用户数据
message SavePlayerDataReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 10198;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    PlayerData player_data = 1;
    uint32 save_stat_id = 2;
}

message SavePlayerDataRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 10112;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    int32 retcode = 1;
    uint32 data_version = 2; // 写回的数据version
    uint32 save_stat_id = 3;
}

message PlayerOnlineStatusInfo {
    enum StatusType {
        ONLINE = 0;
        OFFLINE = 1;
    }

    uint32 uid = 1;
    uint32 platform_type = 2;
    StatusType online_status = 3;
    bool is_sub_account = 4;
    string country_code = 5;
}

// 玩家在线状态通知 game->node, redis的核心数据不用这个协议
message PlayerOnlineStatusNotify {
    enum Enum {
        NONE = 0;
        CMD_ID = 10135;
    }

    repeated PlayerOnlineStatusInfo player_info_list = 1;
}

message ServiceDisconnectNotify {
    enum Enum {
        NONE = 0;
        CMD_ID = 10103;
    }

    ServiceType type = 1; // 服务类型
    uint32 ip = 2;        // 对应服务的IP
}

// 客户端掉线通知, 用来通知gameserver工作线程回写数据、定时logout
message PlayerDisconnectNotify {
    enum Enum {
        NONE = 0;
        CMD_ID = 10190;
    }

    uint32 data = 1; // ENetReason,服务端区分断开的原因
}

// game通知gate断开当前连接
message DisconnectClientNotify {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10173;
    }

    uint32 data = 1; // ENetReason
}

// 加载Group用的提示包，不会真的用于发送消息
message SysCreateGroupReq {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10199;
    }
}

message SaveBlockDataReq {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 10131;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    map<uint32, BlockInfo> block_info_map = 1;
}

message SaveBlockDataRsp {
    enum CmdId {
        option allow_alias = true;
        NONE = 0;
        CMD_ID = 10175;
        ENET_CHANNEL_ID = 0;
        ENET_IS_RELIABLE = 1;
    }

    int32 retcode = 1;
    map<uint32, uint32> block_succ_save_map = 2;
}

message SavePlayerExtraBinDataNotify {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10148;
    }

    uint32 uid = 1;
    bytes player_extra_bin_data = 2;
}

message SysSavePlayerNotify {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10197;
    }
}

message PlayerLoginBlockInfoNotify {
    enum CmdId {
        NONE = 0;
        CMD_ID = 10181;
    }

    uint64 login_rand = 1;
    map<uint32, BlockInfo> block_info_map = 2;
}
