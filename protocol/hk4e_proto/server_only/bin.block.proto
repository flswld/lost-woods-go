// 定义场景group相关数据库中的二进制数据

syntax = "proto3";

package proto;

import "server_only/bin_common.server.proto";

option go_package = "./;proto";

// Gadget中地脉之花宝箱组件的数据
message BlossomChestBin {
    uint32 blossom_chest_id = 1;          // EXCEL中配置的ID
    uint32 drop_id = 2;                   // 掉落ID
    fixed32 dead_time = 3;                // 需要销毁的时间戳
    repeated uint32 qualify_uid_list = 4; // 有资格交互的uid列表
    repeated uint32 remain_uid_list = 5;  // 还可以交互的玩家uid
    uint32 item_limit_type = 6;
    uint32 refresh_id = 7;
}

// Gadget中Platform组件的数据
message GadgetPlatformBin {
    uint32 route_id = 1;   // 路径ID
    int32 point_index = 2; // 路径点索引
    bool is_started = 3;   // 是否在移动中
    uint32 point_id = 4;
    uint32 moving_platform_type = 5;
}

// Gadget中BossChest组件的数据
message BossChestBin {
    repeated uint32 remain_uid_list = 1;  // 还可以交互的玩家uid
    fixed32 dead_time = 2;                // 需要销毁的时间戳
    uint32 dead_level = 3;                // boss死亡时的等级
    repeated uint32 qualify_uid_list = 4; // 有资格交互的uid列表
}

// 区域挑战玩法记录
message ChallengeRecordBin {
    uint32 challenge_index = 1;       // 挑战index
    uint32 challenge_id = 2;          // 挑战id
    uint32 challenge_record_type = 3; // 挑战记录类型，如最短完成时间等
    uint32 best_value = 4;            // 记录的值
}

// boss怪物死亡信息
message BossDieInfoBin {
    repeated uint32 surround_uid_list = 1; // 周边的玩家列表
    fixed32 dead_time = 2;                 // boss死亡时间戳
    uint32 dead_level = 3;                 // boss死亡时等级
}

// 组内触发器数据
message GroupTriggerBin {
    uint32 trigger_count = 1; // 触发次数
    uint32 config_id = 2;
}

message GeneralRewardBin {
    uint32 drop_id = 1;
    uint32 reward_id = 2;
    uint32 drop_num = 3;
    map<uint32, uint32> drop_map = 4;
}

message GadgetGeneralRewardBin {
    uint32 resin = 2;
    uint32 dead_time = 3;
    repeated uint32 remain_uid_list = 5;
    map<uint32, GeneralRewardBin> qualify_info_map = 7;
    uint32 destroy_cd = 8;
    uint32 item_limit_type = 9;
    ItemParamBin item_param = 10;
    repeated uint32 open_state_list = 11;
}

message FishStockBin {
    uint32 stock_type = 1;
    uint32 gen_fish_num = 2;
    uint32 max_num = 3;
}

message GadgetFishPoolBin {
    repeated FishStockBin fish_stock_list = 1;
    uint32 today_fish_num = 2;
    uint32 last_refresh_today_fish_time = 3;
    map<uint32, uint32> cached_fish_map = 4;
}

message CustomGadgetNodeInfoBin {
    int32 parent_index = 1;
    uint32 config_id = 2;
    string slot_identifier = 3;
}

message CustomGadgetTreeInfoBin {
    repeated CustomGadgetNodeInfoBin node_list = 1;
}

message GadgetWorktopBin {
    repeated uint32 option_list = 1;
}

// 组内物件数据
message GroupGadgetBin {
    // uint32 gadget_id = 1;
    // string trigger_name = 2;    // 所属触发器
    uint32 gadget_state = 1;                 // 物件状态
    bool is_enable_interact = 2;
    uint32 gadget_talk_state = 3;
    oneof component {
        GadgetPlatformBin platform = 101;    // Platform组件
        BossChestBin boss_chest = 102;       // boss_chest组件
        BlossomChestBin blossom_chest = 103; // blossom_chest组件
        GadgetGeneralRewardBin general_reward = 104;
        GadgetFishPoolBin fish_pool = 105;
        CustomGadgetTreeInfoBin custom_gadget_tree_info = 106;
        GadgetWorktopBin worktop = 107;
    }
}

// 组内怪物数据
message GroupMonsterBin {
    // uint32 monster_id = 1;
    // string trigger_name = 2;    // 所属触发器
    uint32 dropped_hp_percent = 1; // 已经掉落过的血量万分比最低值
}

message GroupGatherBin {
    uint32 config_id = 1;
    fixed32 last_refresh_time = 2;
}

message GroupRefreshTimeBin {
    uint32 save_type = 1;
    fixed32 last_refresh_time = 2;
}

message GroupBin {
    map<uint32, GroupMonsterBin> monster_map = 1;          // 怪物(key:config_id)
    repeated uint32 del_monster_list = 2;                  // 所有已删除怪物config_id
    map<uint32, GroupGadgetBin> gadget_map = 3;            // 物件(key:config_id)
    repeated uint32 del_gadget_list = 4;                   // 所有已删除物件config_id
    map<string, GroupTriggerBin> trigger_map = 5;          // 所有已触发的触发器(key:name)
    map<string, GroupVariableBin> variable_map = 6;        // 所有已设置变量(key:name)
    uint32 suite_index = 7;                                // 小组索引
    repeated uint32 show_cutscene_chest_list = 8;          // 已经对owner播放过的cutscene的宝箱(config_id)
    repeated ChallengeRecordBin challenge_record_list = 9; // 区域挑战记录
    uint32 revise_level = 10;                              // 修正等级
    fixed32 last_refresh_time = 11;                        // 上次刷新时间
    uint32 target_suite_index = 12;                        // group的目标suite(重新加载的时候才生效)
    map<uint32, BossDieInfoBin> boss_die_info_map = 13;    // boss怪物死亡时信息
    repeated GroupGatherBin gather_refresh_time_list = 14;
    bool is_replaceable = 15;
    uint32 replaceable_version = 16;
    repeated GroupTriggerBin trigger_list = 17;
    repeated GroupRefreshTimeBin group_refresh_list = 18;
    repeated GroupVariableConfigIdBin variable_config_id_bin_list = 19;
}

// 玩家场景数据 按照block 划分
message BlockBin {
    map<uint32, bytes> group_map = 1; // 组数据
    map<uint32, GroupProductBin> group_product_map = 2;
}
